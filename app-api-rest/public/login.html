<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión · Biblioteca</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/login.js"></script>
  </head>
  <body>
    <header id="site-header"></header>

    <main class="page login-page">
      <div class="container">
        <form id="login-form" class="login-card" novalidate>
          <div class="login-header">
            <span class="login-icon" aria-hidden="true">🔐</span>
            <h1>Panel de administración</h1>
            <p class="muted">Inicia sesión para gestionar el catálogo y los préstamos.</p>
          </div>

          <p class="form-error" role="alert" hidden></p>

          <div class="form-group">
            <label for="username">Usuario</label>
            <input id="username" name="username" class="input" autocomplete="username" required />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" class="input" type="password" autocomplete="current-password" required />
          </div>

          <button class="btn btn-primary btn-block" type="submit">Iniciar sesión</button>
          <a class="login-back" href="/">← Volver al catálogo</a>
        </form>
      </div>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
